version: 2

# Tuned for low noise: every ecosystem runs monthly and collapses into one or
# two pull requests. Minor and patch updates share one group per ecosystem and
# auto-merge (see workflows/dependabot-automerge.yml); majors and the
# build-tooling group wait for a human. Security updates would still open their
# own pull requests — enable "Dependabot security updates" in the repository
# settings for that; it is currently switched off.
#
# Dependabot puts each dependency in the FIRST group that matches it, so order
# matters: build-tooling has to come before the catch-all minor/patch group, or
# Vite bumps would auto-merge without the browser check CLAUDE.md asks for.
#
# Peer-coupled packages (eslint + @eslint/js, react-query + devtools, i18next +
# react-i18next, react-hook-form + resolvers + zod) no longer need groups of
# their own: the catch-all groups put them in the same pull request anyway.
updates:
    -   package-ecosystem: composer
        directory: /app
        schedule:
            interval: monthly
        open-pull-requests-limit: 5
        groups:
            php-minor-and-patch:
                update-types:
                    - minor
                    - patch
            php-major:
                patterns:
                    - '*'
                update-types:
                    - major

    -   package-ecosystem: npm
        directory: /app
        schedule:
            interval: monthly
        open-pull-requests-limit: 5

        ignore:
            # typescript-eslint declares `typescript: >=4.8.4 <6.1.0`, and no
            # released version accepts TypeScript 7 — loading it aborts eslint
            # outright. Drop this once typescript-eslint ships TS 7 support:
            # https://github.com/typescript-eslint/typescript-eslint/issues/10940
            -   dependency-name: 'typescript'
                versions:
                    - '>=7'
            # v9 is an API rewrite (createCoreRowModel, feature-based table
            # types), not a bump: it fails to compile against
            # assets/js/components/data-table/. Remove this when someone
            # schedules the migration.
            -   dependency-name: '@tanstack/react-table'
                update-types:
                    - version-update:semver-major
            # ESLint 10 is blocked by eslint-plugin-react. Its latest release
            # (7.37.5) declares `eslint: ^3 || … || ^9.7` and genuinely breaks
            # on 10 — every rule fails to load with "contextOrFilename.getFilename
            # is not a function", because ESLint 10 dropped the legacy context API
            # its React-version detection calls. eslint-plugin-react-hooks and
            # typescript-eslint are both ready; this one package is the holdout.
            # Lift both entries together once it ships ESLint 10 support.
            -   dependency-name: 'eslint'
                update-types:
                    - version-update:semver-major
            -   dependency-name: '@eslint/js'
                update-types:
                    - version-update:semver-major
            # @types/node majors track Node majors, so this one is pinned to the
            # Node the project actually runs: CI builds on 24 (LTS Krypton) and
            # package.json floors at 22.19 (LTS Jod). @types/node 26 describes
            # Node 26, which is Current and not LTS, so accepting it would have
            # tsc type-check the build tooling against a runtime nobody here
            # uses. The exposure is small — only vite.config.ts and
            # vitest.config.mts see Node's types at all, via tsconfig.node.json,
            # and they use nothing but node:url and process.env — but there is
            # no upside to the drift either. Raise this to match whenever the
            # CI node-version in ci.yml moves to the next LTS.
            -   dependency-name: '@types/node'
                update-types:
                    - version-update:semver-major

        groups:
            # Vite, Tailwind and TypeScript move together: a Vite major usually
            # drags its plugins along, and Tailwind 4 lives in the Vite plugin.
            # Never auto-merged, so it must stay first. Patterns must name
            # packages that exist in app/package.json: one that matches nothing
            # lets its package fall through into the auto-merged group.
            build-tooling:
                patterns:
                    - 'vite'
                    - 'vite-plugin-*'
                    - '@vitejs/*'
                    - 'tailwindcss'
                    - '@tailwindcss/*'
                    - 'typescript'
                    - '@types/node'
            js-minor-and-patch:
                update-types:
                    - minor
                    - patch
            js-major:
                patterns:
                    - '*'
                update-types:
                    - major

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: monthly
        groups:
            actions:
                patterns:
                    - '*'
