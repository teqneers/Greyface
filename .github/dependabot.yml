version: 2

# Updates are grouped so a week's worth of transitive bumps arrives as one pull
# request per ecosystem instead of dozens. Security updates still open their own
# pull requests — enable "Dependabot security updates" in the repository
# settings for that; it is currently switched off.
updates:
    -   package-ecosystem: composer
        directory: /app
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        groups:
            symfony:
                patterns:
                    - 'symfony/*'
            doctrine:
                patterns:
                    - 'doctrine/*'
            php-minor-and-patch:
                update-types:
                    - minor
                    - patch

    -   package-ecosystem: npm
        directory: /app
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        groups:
            react:
                patterns:
                    - 'react'
                    - 'react-dom'
                    - '@types/react'
                    - '@types/react-dom'
            build-tooling:
                patterns:
                    - '@babel/*'
                    - '@symfony/webpack-encore'
                    - 'webpack*'
                    - 'babel-loader'
                    - 'sass*'
                    - 'postcss*'
                    - 'ts-loader'
                    - 'typescript'
                    - 'eslint*'
                    - '@typescript-eslint/*'
            js-minor-and-patch:
                update-types:
                    - minor
                    - patch

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        groups:
            actions:
                patterns:
                    - '*'
