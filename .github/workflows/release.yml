name: Release

# Pushing a v-prefixed tag publishes a release: archives on the GitHub release
# page and a multi-architecture image on GHCR. Running this by hand from the
# Actions tab publishes a `nightly` image and a rolling pre-release instead,
# built from whatever branch you dispatch it on.
on:
    push:
        tags: [ 'v*' ]
    workflow_dispatch:

# Third-party actions are pinned to a commit SHA rather than a floating major
# tag, matching ci.yml: a mutable tag can be repointed at any time, and
# Dependabot cannot tell which patch a runner will actually get.
permissions:
    contents: read

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/greyface

jobs:
    # ---------------------------------------------------------------- version
    prepare:
        name: Work out the version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            build: ${{ steps.version.outputs.build }}
            tags: ${{ steps.version.outputs.tags }}
            release: ${{ steps.version.outputs.release }}
            prerelease: ${{ steps.version.outputs.prerelease }}

        steps:
            - name: Derive the version and image tags
              id: version
              env:
                  # Never interpolate a ref name straight into a shell command: a
                  # tag is attacker-chosen text as far as the runner is concerned.
                  REF_NAME: ${{ github.ref_name }}
                  REF_TYPE: ${{ github.ref_type }}
                  SHA: ${{ github.sha }}
                  IMAGE: ${{ env.IMAGE }}
              run: |
                  set -eu
                  short="$(printf '%s' "$SHA" | cut -c1-7)"
                  echo "build=${short}" >> "$GITHUB_OUTPUT"

                  if [ "$REF_TYPE" = 'tag' ]; then
                      case "$REF_NAME" in
                          v[0-9]*.[0-9]*.[0-9]*) ;;
                          *)
                              echo "Refusing to release from the tag '$REF_NAME'." >&2
                              echo "Release tags look like v3.0.0 or v3.0.0-rc1." >&2
                              exit 1
                              ;;
                      esac

                      version="${REF_NAME#v}"
                      echo "version=${version}" >> "$GITHUB_OUTPUT"
                      echo "release=true" >> "$GITHUB_OUTPUT"

                      case "$version" in
                          *-*)
                              # A pre-release such as 3.0.0-rc1 gets its exact tag
                              # and nothing else. Moving `latest` or `3` onto a
                              # release candidate would hand it to everyone who
                              # pinned loosely.
                              echo "prerelease=true" >> "$GITHUB_OUTPUT"
                              echo "tags=${IMAGE}:${version}" >> "$GITHUB_OUTPUT"
                              ;;
                          *)
                              # Plus the moving 3.0 / 3 / latest tags, so an operator
                              # can pin as loosely or as tightly as they like.
                              major="${version%%.*}"
                              minor="${version%.*}"
                              echo "prerelease=false" >> "$GITHUB_OUTPUT"
                              echo "tags=${IMAGE}:${version},${IMAGE}:${minor},${IMAGE}:${major},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
                              ;;
                      esac
                  else
                      {
                          echo "version=nightly-${short}"
                          echo "release=false"
                          echo "prerelease=true"
                          echo "tags=${IMAGE}:nightly,${IMAGE}:nightly-${short}"
                      } >> "$GITHUB_OUTPUT"
                  fi

    # ------------------------------------------------------------------ tests
    # Tags can be pushed at any commit, including one that never went through a
    # pull request, so the suite runs here rather than trusting history.
    test:
        name: Test
        uses: ./.github/workflows/ci.yml

    # --------------------------------------------------------------- archives
    # The turnkey download: unpack it into a web root and it runs. This replaces
    # the old deploy/* tags, which committed the same content into git.
    archive:
        name: Build the archives
        runs-on: ubuntu-latest
        needs: [ prepare, test ]

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  extensions: ctype, iconv, intl, pdo_mysql, zip
                  tools: composer:v2
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: yarn
                  cache-dependency-path: app/yarn.lock

            - name: Stamp the version
              working-directory: app
              # version.php is read by AppController and shown in the account menu.
              # A working copy says "dev"; only a release carries a real version.
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  BUILD: ${{ needs.prepare.outputs.build }}
              run: |
                  set -eu
                  printf "<?php\n\n/** Written by .github/workflows/release.yml at build time. */\n\ndefine('PRODUCT_VERSION', '%s');\ndefine('PRODUCT_BUILD', '%s');\n" \
                      "$VERSION" "$BUILD" > version.php
                  php -l version.php

            - name: Build the frontend
              working-directory: app
              run: |
                  yarn install --frozen-lockfile
                  yarn build

            - name: Install the production dependencies
              working-directory: app
              run: composer install --no-dev --classmap-authoritative --no-scripts --no-interaction --prefer-dist

            - name: Assemble the archives
              id: assemble
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  set -eu
                  staging="$(mktemp -d)/greyface-${VERSION}"
                  mkdir -p "${staging}"

                  # Mirrors what the old deploy tag shipped: the application, its
                  # vendor tree and the compiled frontend, without the things only
                  # a developer needs. The committed .env is deliberately excluded
                  # — it carries a placeholder secret and APP_ENV=dev.
                  rsync -a --exclude '.git' \
                           --exclude '.github' \
                           --exclude 'docker' \
                           --exclude 'docs' \
                           --exclude '.env' \
                           --exclude '.env.test' \
                           --exclude 'app/tests' \
                           --exclude 'app/node_modules' \
                           --exclude 'app/.phpunit.cache' \
                           --exclude 'app/phpunit.xml.dist' \
                           --exclude 'app/coverage.xml' \
                           ./ "${staging}/"

                  # var/ must exist and be writable; only its .gitignore is tracked.
                  mkdir -p "${staging}/var/cache" "${staging}/var/log"

                  # Symfony's Dotenv refuses to boot without a .env next to the
                  # project directory, so ship the same one the container does:
                  # the environment name and nothing else. The repository's own
                  # .env is excluded above because it carries APP_ENV=dev and a
                  # placeholder secret. Real settings go in .env.local.
                  cp docker/production/env "${staging}/.env"

                  cd "$(dirname "${staging}")"
                  tar -czf "${GITHUB_WORKSPACE}/greyface-${VERSION}.tar.gz" "greyface-${VERSION}"
                  zip -qr "${GITHUB_WORKSPACE}/greyface-${VERSION}.zip"    "greyface-${VERSION}"

                  cd "${GITHUB_WORKSPACE}"
                  sha256sum "greyface-${VERSION}.tar.gz" "greyface-${VERSION}.zip" > "greyface-${VERSION}.sha256"
                  cat "greyface-${VERSION}.sha256"

            - name: Upload the archives
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: archives
                  path: |
                      greyface-*.tar.gz
                      greyface-*.zip
                      greyface-*.sha256
                  if-no-files-found: error
                  retention-days: 7

    # ------------------------------------------------------------------ image
    # Built natively on each architecture rather than under emulation, because
    # the image compiles PHP extensions and QEMU makes that painfully slow.
    # Each job pushes by digest only; no tag points at them until the smoke test
    # has passed and the manifest job runs.
    image:
        name: Image (${{ matrix.platform }})
        runs-on: ${{ matrix.runner }}
        needs: [ prepare, test ]
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   platform: linux/amd64
                        runner: ubuntu-latest
                    -   platform: linux/arm64
                        runner: ubuntu-24.04-arm

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Stamp the version
              working-directory: app
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  BUILD: ${{ needs.prepare.outputs.build }}
              run: |
                  set -eu
                  printf "<?php\n\n/** Written by .github/workflows/release.yml at build time. */\n\ndefine('PRODUCT_VERSION', '%s');\ndefine('PRODUCT_BUILD', '%s');\n" \
                      "$VERSION" "$BUILD" > version.php

            - name: Set up Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Sign in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: docker/production/Dockerfile
                  platforms: ${{ matrix.platform }}
                  cache-from: type=gha,scope=${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Record the digest
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${{ steps.build.outputs.digest }}"

            - name: Upload the digest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digest-${{ strategy.job-index }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # ------------------------------------------------------------- smoke test
    # The only step that starts the image. It exercises the entrypoint, the
    # configuration check, the migrations and first-admin creation — none of
    # which the unit and integration suites touch. Nothing is tagged if it fails.
    smoke:
        name: Boot the image
        runs-on: ubuntu-latest
        needs: [ prepare, image ]
        permissions:
            contents: read
            packages: read

        services:
            database:
                image: mariadb:11.2
                env:
                    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
                    MARIADB_DATABASE: sqlgrey
                ports: [ '3306:3306' ]
                options: >-
                    --health-cmd "healthcheck.sh --connect --innodb_initialized"
                    --health-interval 5s --health-timeout 5s --health-retries 20

        steps:
            - name: Download the digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: digest-*
                  merge-multiple: true
                  path: /tmp/digests

            - name: Sign in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Stand up a SQLGrey database
              # Greyface reads and writes SQLGrey's tables but never creates them,
              # so the smoke test has to look like a real SQLGrey installation.
              # This is SQLGrey 1.8.0's own schema, character for character, with
              # no CHARACTER SET clause — SQLGrey does not specify one either, so
              # the tables follow the database default exactly as they would in
              # production. greyface:fixtures:load creates the same thing for
              # development and test.
              run: |
                  docker run --rm --network host -i mariadb:11.2 \
                      mariadb -h 127.0.0.1 -uroot sqlgrey <<'SQL'
                  CREATE TABLE connect (sender_name varchar(64) NOT NULL, sender_domain varchar(255) NOT NULL, src varchar(39) NOT NULL, rcpt varchar(255) NOT NULL, first_seen timestamp NOT NULL, KEY connect_idx (src,sender_domain,sender_name), KEY connect_fseen (first_seen)) ENGINE=InnoDB;
                  CREATE TABLE from_awl (sender_name varchar(64) NOT NULL, sender_domain varchar(255) NOT NULL, src varchar(39) NOT NULL, first_seen timestamp NOT NULL, last_seen timestamp NOT NULL, PRIMARY KEY (src,sender_domain,sender_name), KEY from_awl_lseen (last_seen)) ENGINE=InnoDB;
                  CREATE TABLE domain_awl (sender_domain varchar(255) NOT NULL, src varchar(39) NOT NULL, first_seen timestamp NOT NULL, last_seen timestamp NOT NULL, PRIMARY KEY (src,sender_domain), KEY domain_awl_lseen (last_seen)) ENGINE=InnoDB;
                  CREATE TABLE config (parameter varchar(255) NOT NULL, value varchar(255) DEFAULT NULL, PRIMARY KEY (parameter)) ENGINE=InnoDB;
                  CREATE TABLE optin_domain (domain varchar(255) NOT NULL, PRIMARY KEY (domain)) ENGINE=InnoDB;
                  CREATE TABLE optin_email (email varchar(255) NOT NULL, PRIMARY KEY (email)) ENGINE=InnoDB;
                  CREATE TABLE optout_domain (domain varchar(255) NOT NULL, PRIMARY KEY (domain)) ENGINE=InnoDB;
                  CREATE TABLE optout_email (email varchar(255) NOT NULL, PRIMARY KEY (email)) ENGINE=InnoDB;
                  INSERT INTO connect VALUES ('sender','partner.example','203.0.113','postmaster@site.test',NOW());
                  SQL

            - name: Refuse to start without a secret
              # The negative case matters as much as the positive one: a published
              # image must never come up with the placeholder secret from the repo.
              run: |
                  set -eu
                  digest="$(basename "$(ls /tmp/digests | head -1)")"
                  image="${{ env.IMAGE }}@${digest}"
                  echo "image=${image}" >> "$GITHUB_ENV"

                  if docker run --rm --network host \
                       -e DATABASE_URL='mysql://root@127.0.0.1:3306/sqlgrey' \
                       "${image}"; then
                      echo 'The container started without APP_SECRET; it must not.' >&2
                      exit 1
                  fi
                  echo 'Refused to start without APP_SECRET, as expected.'

            - name: Start it properly
              run: |
                  set -eu
                  docker run -d --name greyface --network host \
                      -e DATABASE_URL='mysql://root@127.0.0.1:3306/sqlgrey' \
                      -e APP_SECRET="$(openssl rand -hex 32)" \
                      -e GREYFACE_ADMIN_USER=smoke \
                      -e GREYFACE_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
                      "${image}"

                  for _ in $(seq 1 30); do
                      status="$(docker inspect --format '{{.State.Health.Status}}' greyface 2>/dev/null || echo starting)"
                      [ "${status}" = 'healthy' ] && break
                      [ "$(docker inspect --format '{{.State.Running}}' greyface)" = 'false' ] && break
                      sleep 2
                  done
                  docker logs greyface

            - name: Check what it actually serves
              run: |
                  set -eu
                  code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/login)"
                  [ "${code}" = '200' ] || { echo "login page returned ${code}"; exit 1; }

                  # The compiled frontend has to be in the image, not merely built.
                  curl -s http://127.0.0.1/login | grep -q '/build/assets/' \
                      || { echo 'the login page references no built assets'; exit 1; }

                  query() {
                      docker run --rm --network host mariadb:11.2 \
                          mariadb -h 127.0.0.1 -uroot -N sqlgrey -e "$1"
                  }

                  # The entrypoint must have migrated Greyface's own tables,
                  # created the administrator...
                  users="$(query 'SELECT COUNT(*) FROM tq_users')"
                  [ "${users}" = '1' ] || { echo "expected one user, found ${users}"; exit 1; }
                  # ...and left SQLGrey's row exactly where it was.
                  rows="$(query 'SELECT COUNT(*) FROM connect')"
                  [ "${rows}" = '1' ] || { echo "SQLGrey's connect table now has ${rows} rows"; exit 1; }

                  echo 'Image serves, migrates and leaves SQLGrey alone.'

    # --------------------------------------------------------------- manifest
    # Only now do the human-readable tags start pointing at anything.
    manifest:
        name: Publish the image tags
        runs-on: ubuntu-latest
        needs: [ prepare, smoke ]
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download the digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: digest-*
                  merge-multiple: true
                  path: /tmp/digests

            - name: Sign in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Create the multi-architecture manifest
              working-directory: /tmp/digests
              run: |
                  set -eu
                  tags=''
                  for tag in $(echo '${{ needs.prepare.outputs.tags }}' | tr ',' ' '); do
                      tags="${tags} --tag ${tag}"
                  done
                  # shellcheck disable=SC2046
                  docker buildx imagetools create ${tags} \
                      $(printf '${{ env.IMAGE }}@sha256:%s ' *)

            - name: Show what was published
              run: docker buildx imagetools inspect '${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}'

    # ---------------------------------------------------------------- release
    release:
        name: Publish the release
        runs-on: ubuntu-latest
        needs: [ prepare, archive, manifest ]
        permissions:
            contents: write

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Download the archives
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: archives
                  path: dist

            - name: Create or update the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
                  IS_RELEASE: ${{ needs.prepare.outputs.release }}
                  IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
                  IMAGE: ${{ env.IMAGE }}
              run: |
                  set -eu
                  notes="Container image: \`docker pull ${IMAGE}:${VERSION}\`"

                  if [ "${IS_RELEASE}" = 'true' ]; then
                      prerelease=''
                      [ "${IS_PRERELEASE}" = 'true' ] && prerelease='--prerelease'
                      # shellcheck disable=SC2086
                      gh release create "${GITHUB_REF_NAME}" dist/* ${prerelease} \
                          --title "${VERSION}" \
                          --generate-notes \
                          --notes "${notes}"
                  else
                      # One rolling pre-release, replaced on each manual build, so
                      # nightlies do not accumulate on the releases page.
                      gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
                      gh release create nightly dist/* \
                          --title "Nightly (${VERSION})" \
                          --prerelease \
                          --target "${GITHUB_SHA}" \
                          --notes "Built from ${GITHUB_SHA}. Unreleased; expect breakage.

                  ${notes}"
                  fi
