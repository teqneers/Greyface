name: Dependabot auto-merge

on:
    pull_request:
        branches: [ master ]

# Turns on GitHub's auto-merge for Dependabot's patch and minor updates. The
# merge itself waits for the CI checks that master's branch protection
# requires, so this workflow never merges anything untested.
#
# Left for a human:
# - major updates, which are API changes rather than bumps;
# - the build-tooling group (Vite, Tailwind, TypeScript): the unit tests never
#   render the real bundle, so a build change needs a look in the browser
#   before it lands — see CLAUDE.md.
permissions:
    contents: write
    pull-requests: write

jobs:
    automerge:
        name: Enable auto-merge
        runs-on: ubuntu-latest
        if: github.event.pull_request.user.login == 'dependabot[bot]'

        steps:
            - name: Read the update metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

            - name: Enable auto-merge
              if: >-
                  steps.metadata.outputs.update-type != 'version-update:semver-major'
                  && steps.metadata.outputs.dependency-group != 'build-tooling'
              run: gh pr merge --auto --merge "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
