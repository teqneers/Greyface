name: CI

on:
    push:
        branches: [ master ]
        paths-ignore: [ '**.md', 'LICENSE' ]
    pull_request:
        branches: [ master ]
        paths-ignore: [ '**.md', 'LICENSE' ]
    # release.yml runs this suite against the exact tagged commit before it
    # builds anything, so a tag can never publish something untested.
    workflow_call:

# Third-party actions are pinned to a commit SHA rather than a floating major
# tag: a mutable tag can be repointed at any time, and Dependabot cannot tell
# which patch a runner will actually get.
jobs:
    backend:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.3', '8.4', '8.5' ]

        services:
            # MariaDB, not MySQL: greyface:fixtures:load creates SQLGrey's tables
            # with `DEFAULT "0000-00-00 00:00:00"` columns, which MySQL rejects
            # under its default NO_ZERO_DATE sql_mode.
            database:
                image: mariadb:11.2
                env:
                    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
                    MARIADB_DATABASE: greyface
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php-version }}
                  # intl is load-bearing, not optional: translations/ uses the
                  # +intl-icu domain, which Symfony formats through ext-intl.
                  extensions: ctype, iconv, intl, pdo_mysql
                  tools: composer:v2
                  coverage: pcov

            - name: Get the composer cache directory
              id: composer-cache
              working-directory: app
              run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('app/composer.lock') }}
                  restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

            - name: Validate composer.json
              working-directory: app
              run: composer validate --no-check-publish

            - name: Install dependencies
              working-directory: app
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Audit dependencies for known vulnerabilities
              working-directory: app
              # Reported, not enforced: the suite has to keep running while the
              # Symfony 7.1 -> 7.4 upgrade is still outstanding.
              continue-on-error: true
              run: composer audit

            # A real environment variable beats every .env file, so this needs
            # no .env.test.local — which would otherwise be picked up by the
            # compose stack too and point it at the wrong host.
            - name: Run the test suite
              working-directory: app
              env:
                  DATABASE_URL: mysql://root@127.0.0.1:3306/greyface_test
              run: bin/phpunit --coverage-clover=coverage.xml

            - name: Enforce the coverage ratchet
              working-directory: app
              # Raise this as coverage improves; never lower it to make a build pass.
              run: php bin/check-coverage.php coverage.xml 92

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        env:
            # The runner ships a global TypeScript (7.x since 2026-09) under
            # /usr/local/lib/node_modules. Node falls back to NODE_PATH when a
            # require() misses locally, so a hiccup in the install surfaces as
            # "typescript-eslint does not support TS 7.0" instead of a missing
            # module. Clearing it keeps resolution inside app/node_modules.
            NODE_PATH: ''

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # 24 is the current LTS. It must stay >= 22.19: @testing-library/jest-dom
                  # needs Node 22 and undici needs 22.19, and yarn enforces the engines field.
                  node-version: '24'
                  cache: yarn
                  cache-dependency-path: app/yarn.lock

            - name: Install dependencies
              working-directory: app
              run: yarn install --frozen-lockfile

            - name: Verify TypeScript resolves to the project's own copy
              working-directory: app
              # The runner ships a global TypeScript. If the project's copy is ever
              # missing, Node silently falls back to that one and eslint aborts with
              # a confusing "typescript-eslint does not support TS 7.0". Fail here
              # instead, naming the culprit. The version itself is the lockfile's job.
              run: |
                  node -e "
                    const resolved = require.resolve('typescript');
                    console.log('typescript', require('typescript/package.json').version, 'from', resolved);
                    if (!resolved.startsWith(process.cwd())) {
                      throw new Error('resolved TypeScript from outside the project: ' + resolved);
                    }
                  "

            - name: Lint
              working-directory: app
              run: yarn lint

            - name: Test
              working-directory: app
              run: yarn test

            - name: Build
              working-directory: app
              run: yarn build
