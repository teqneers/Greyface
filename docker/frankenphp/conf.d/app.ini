; PHP settings for the Greyface development container.
;
; Development values throughout — this image is not used for production.

; Symfony's container compilation and Doctrine's proxy generation are memory
; hungry on a cold cache; the default 128M is not enough for a test run.
memory_limit = 512M

; Surface everything. The application sets its own error_reporting per
; environment, but anything happening before the kernel boots should be visible.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = UTC

; Revalidate on every request so edits to bind-mounted source take effect
; immediately. Correctness over throughput in development.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000

; Symfony's profiler and Doctrine's stack traces get deep.
zend.exception_ignore_args = Off
zend.assertions = 1

; Xdebug is installed but idle. Turn it on for one run without rebuilding:
;   XDEBUG_MODE=debug docker compose up -d php
; pcov handles coverage, so leave this off for `bin/phpunit --coverage-*` —
; enabling both at once makes the suite several times slower.
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
xdebug.idekey = PHPSTORM
