# Development and test environment for Greyface.
#
# From the repository root:
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml exec php composer install
#   docker compose -f docker/compose.yaml exec php bin/phpunit
#
# Or `cd docker` first and drop the -f flag — Compose finds this file there.
# Note that Compose reads its own .env for ${...} substitution from *this*
# directory, which keeps it clear of Symfony's .env in the repository root.
#
# then open https://localhost:18443 (accept the certificate the first time, or
# trust Caddy's local CA — see docker/README.md).
#
# Published ports use a 1xxxx prefix so this stack can run alongside the other
# project stacks on the same machine. Override any of them in a .env file next
# to this one if they still collide.
#
# This covers development and testing only. Production still ships through
# app/files/build_tag.sh; there is deliberately no production stack here.
#
# The repository root is mounted at /srv/greyface, not the app/ directory:
# public/index.php derives APP_PATH as dirname($script, 3), so the application
# has to sit at <root>/app/public for caches and logs to land in <root>/var.

# Compose derives the project name from the directory holding this file, which
# would make everything "docker-*" now that it lives here. Pin it so container
# and volume names stay stable.
name: greyface

services:
    php:
        build:
            # The repository root, so the Dockerfile can reach both docker/ and
            # the application tree. .dockerignore keeps vendor/ and node_modules/
            # out of the build context.
            context: ..
            dockerfile: docker/frankenphp/Dockerfile
        depends_on:
            database:
                condition: service_healthy
        environment:
            # Caddy issues a locally-trusted certificate from its internal CA for
            # this name. Override it (and add a hosts entry) if you prefer the
            # greyface.test hostname the frontend dev-server expects.
            SERVER_NAME: ${SERVER_NAME:-localhost}
            # Caddy binds these directly, and they are published 1:1 below, so
            # the redirects it generates carry the right port.
            HTTP_PORT: ${HTTP_PORT:-18080}
            HTTPS_PORT: ${HTTPS_PORT:-18443}
            # APP_ENV is deliberately NOT set here. PHP runs with
            # variables_order=EGPCS, so a container environment variable lands in
            # $_ENV — and Symfony's KernelTestCase reads $_ENV before the $_SERVER
            # value phpunit.xml.dist forces, which would silently run the whole
            # test suite in the dev environment. The committed .env already
            # selects dev for normal requests; leave it to do its job.
            # Xdebug is installed but idle unless this says otherwise. Leave it
            # off while running coverage — pcov does that job far faster.
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
        ports:
            # Published 1:1 on purpose — see HTTP_PORT/HTTPS_PORT above.
            - '${HTTP_PORT:-18080}:${HTTP_PORT:-18080}'
            - '${HTTPS_PORT:-18443}:${HTTPS_PORT:-18443}'
        volumes:
            - ..:/srv/greyface
            # Mounted as well as baked into the image, so editing the server or
            # PHP config only needs `docker compose restart php`, not a rebuild.
            - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
            - ./frankenphp/conf.d/app.ini:/usr/local/etc/php/conf.d/zz-greyface.ini:ro
            # var/ gets its own volume rather than being shared with the host.
            # Symfony bakes absolute paths into the compiled container, so a
            # cache built at /Users/... is invalid at /srv/greyface and vice
            # versa: sharing the directory makes the host and the container
            # rebuild over each other's work, and a half-written cache produces
            # confusing "file not found" errors.
            #   docker compose exec php cat ../var/log/dev.log
            - app_var:/srv/greyface/var
            # Persist the internal CA so the certificate stays trusted across
            # rebuilds instead of being regenerated every time.
            - caddy_data:/data
            - caddy_config:/config
        # On Linux the container writes var/cache and var/log as root. If that
        # gets in the way, run as yourself instead:
        #   user: "${UID:-1000}:${GID:-1000}"

    database:
        # MariaDB, not MySQL. Migration Version20220721081217 creates the SQLGrey
        # tables with `DEFAULT "0000-00-00 00:00:00"`, which MySQL rejects under
        # its default NO_ZERO_DATE / STRICT_TRANS_TABLES sql_mode. The version
        # also matches server_version in app/config/packages/doctrine.yaml.
        image: mariadb:11.2
        environment:
            # .env.test connects as root with no password and needs to DROP and
            # CREATE the greyface_test database on every test run.
            MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
            # Matches DATABASE_URL in .env for the dev environment.
            MARIADB_DATABASE: greyface
            MARIADB_USER: greyface
            MARIADB_PASSWORD: greyface
        ports:
            # Published so the test suite can also be run from the host.
            - '${DATABASE_PORT:-13306}:3306'
        volumes:
            - database_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
    database_data:
    app_var:
    caddy_data:
    caddy_config:
