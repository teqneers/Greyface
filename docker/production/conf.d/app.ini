; PHP settings for the production image. The inverse of the development file:
; nothing here reveals internals, and opcache trusts what it compiled.
memory_limit = 256M

; Never show a stack trace to a visitor. Errors go to the log, which monolog
; already writes to stderr as JSON in prod, which is what a container wants.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

date.timezone = UTC

; The source cannot change under a running container, so never stat it again.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Arguments in stack traces can hold passwords; assertions are a development aid.
zend.exception_ignore_args = On
zend.assertions = -1
